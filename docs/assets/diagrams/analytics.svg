<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">Analytics pipeline</title>
  <desc id="d">Each routing decision is recorded by the dispatch hook. When the thread goes idle, Gearshift reads the finished turn's token usage, prices it at list prices for the routed model and for the provider's top gear, and shows both on the analytics page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#171d29"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#56606d"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b041"/></marker>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="44" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="1.6">ANALYTICS</text>
    <path d="M255 150 L305 150" fill="none" stroke="#56606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M515 150 L565 150" fill="none" stroke="#56606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M795 150 L822 150 L822 95 L850 95" fill="none" stroke="#56606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M795 150 L822 150 L822 205 L850 205" fill="none" stroke="#56606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M1060 95 L1072 95 L1072 150 L1085 150" fill="none" stroke="#56606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M1060 205 L1072 205 L1072 150 L1085 150" fill="none" stroke="#56606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="45" y="110" width="210" height="80" rx="12" fill="#1c2330" stroke="#2f3846"/>
    <text x="150" y="145.7" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">Decision recorded</text>
    <text x="150" y="165.2" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">(dispatch hook)</text>
    <rect x="305" y="110" width="210" height="80" rx="12" fill="#1c2330" stroke="#2f3846"/>
    <text x="410" y="155.4" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">Thread goes idle</text>
    <rect x="565" y="110" width="230" height="80" rx="12" fill="#1c2330" stroke="#2f3846"/>
    <text x="680" y="145.7" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">Finished turn's</text>
    <text x="680" y="165.2" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">token usage</text>
    <rect x="850" y="60" width="210" height="70" rx="12" fill="#1c2330" stroke="#2f3846"/>
    <text x="955" y="90.7" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">Cost at list prices</text>
    <text x="955" y="110.2" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">(routed model)</text>
    <rect x="850" y="170" width="210" height="70" rx="12" fill="#1c2330" stroke="#2f3846"/>
    <text x="955" y="200.7" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">Same usage on</text>
    <text x="955" y="220.2" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">the top gear</text>
    <rect x="1085" y="110" width="150" height="80" rx="12" fill="#1c2330" stroke="#2f3846"/>
    <text x="1160" y="145.7" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">Analytics</text>
    <text x="1160" y="165.2" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">page</text>
  </g>
</svg>
